global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "geth"
    static_configs:
      - targets: ["geth:6060"]
    metrics_path: /debug/metrics/prometheus

  - job_name: "lighthouse"
    static_configs:
      - targets: ["lighthouse:5054"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
